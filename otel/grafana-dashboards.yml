# Dashboard provider. Tells Grafana to load every dashboard JSON it finds in a
# directory at startup, the same way grafana-datasources.yml wires the datasources.
#
# The alternative is importing the JSON by hand through the UI, which makes the
# dashboard a thing that lives in Grafana's database rather than in git. Provisioning
# keeps it a reviewable file: `git diff` shows a changed panel query.
apiVersion: 1

providers:
  - name: jobtracker
    orgId: 1
    folder: ''
    type: file
    # Provisioned dashboards are read-only in the UI unless this is true. Leaving it
    # true lets you experiment with a panel live — but edits are overwritten on the next
    # restart, so anything worth keeping has to be saved back into the JSON file.
    allowUiUpdates: true
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # Directory, not a file. Every *.json in here becomes a dashboard.
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

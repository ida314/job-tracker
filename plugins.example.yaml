# Plugins: the parts of this system you switch on and off.
#
# Two kinds. An IMPORT plugin is a feed of postings that is not a board in
# companies.yaml (discord, below). A TASK plugin is the switch for one of the bounded
# model roles in jobtracker/tasks/ — it reads no feed and holds no cursor, and the only
# setting it has is `enabled`.
#
# Each plugin declares its own settings, so a key below belongs to the plugin it sits
# under and nowhere else. An unknown key is refused rather than ignored.
#
# Copy this to `plugins.yaml` (gitignored) or just run the commands — every writer is
# something you typed, and nothing scheduled ever touches this file:
#
#   jobtracker plugins list
#   jobtracker plugins enable discord
#   jobtracker plugins set discord channel_id=123456789012345678 label=new-grad-jobs
#   jobtracker plugins disable discord
#   jobtracker plugins purge discord            # dry run; --write applies (feeds only)
#
# THE BOT TOKEN IS NOT IN THIS FILE and must not be put here. It is
# $JOBTRACKER_DISCORD_TOKEN, in the environment. A config file gets `cat`ed into a
# terminal and pasted into an issue; gitignored is not the same protection as never on
# disk. See docs/plugins.md for the full setup, including the Discord permissions and
# the MESSAGE CONTENT intent — without which every message arrives with its text blank
# and the channel reports zero jobs while being full of them.
#
# Note: unlike answers.yaml, this file round-trips through the YAML writer, so comments
# you add here do NOT survive the next `plugins enable`. That is an acceptable trade for
# four scalar keys with no prose in them; this example file is the documented copy.

discord:
  # Off until you say otherwise. Installing a plugin never starts reading anything.
  enabled: false

  # Discord's numeric id, not the channel name: turn on Developer Mode
  # (User Settings -> Advanced), then right-click the channel -> Copy Channel ID.
  channel_id: ""

  # Only used to build a clickable permalink back to the message. Right-click the
  # server name -> Copy Server ID.
  guild_id: ""

  # Names the posting group, so it reads as "Discord: #new-grad-jobs" everywhere.
  label: ""

  # How far back the FIRST read reaches. After that the stored cursor takes over and
  # only new messages are read. No extra API call is needed for this: a Discord message
  # id encodes its own timestamp.
  backfill_days: 14

  # A channel announces a job and never retracts it, so imported postings close by age
  # rather than by disappearing from a board. 0 means never expire, which is a real
  # choice — it means "only ever close for a better-known reason".
  expire_after_days: 90

# The bounded model roles. `level`, `judge` and `inbox` are on unless you say otherwise —
# they predate this switch, and adding it was not meant to change what anyone's queue
# does. `tailor` is off, like any newly installed plugin.
#
# These entries are optional. Delete the block and every role keeps its default.

tailor:
  # Reads a posting's description and your resume, and proposes edits to the resume.
  # It only ever proposes: `jobtracker tailor build` is what assembles a PDF, and
  # `--attach` is what makes one a posting's resume. Needs $JOBTRACKER_RESUME_TEX to
  # point at a LaTeX resume; without one it reports itself unavailable rather than idle.
  enabled: false

# level:
#   enabled: true
# judge:
#   enabled: true
# inbox:
#   enabled: true

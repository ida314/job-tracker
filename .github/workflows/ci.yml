# Continuous integration: the same three checks a reviewer would run by hand, on every
# push and PR. This is an application-repo concern only — it builds and tests the image,
# it does not deploy anything (deployment lives in a separate repo; see CLAUDE.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch/PR makes an in-flight run obsolete — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the runtime the image ships (Dockerfile: python:3.14-slim), so a passing
      # CI run means the same interpreter the container will use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint gate is deliberately NARROW: F (pyflakes — undefined names, unused imports,
      # broken f-strings) plus E9 (syntax/IO errors). These are bugs. Line length (E501)
      # is intentionally not enforced — this repo's dense, load-bearing comments run long
      # on purpose, and a blanket reformat would bury the reasoning they carry.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check --select F,E9 jobtracker/ tests/

      # Every module imports cleanly under the target interpreter — catches a syntax or
      # import error even in a file no test touches.
      - name: Compile
        run: python -m compileall -q jobtracker tests

      - name: Test
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deliverable is a container; a broken Dockerfile is a broken build regardless
      # of green tests. Build it (no push — publishing is the deployment repo's job).
      - name: Build image
        run: docker build -t jobtracker:ci .

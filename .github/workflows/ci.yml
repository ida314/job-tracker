# Continuous integration, and — on green main only — publication of the image.
#
# "Publishes an artifact" is as far as this goes, and that is deliberate. The repo still
# names no orchestrator (CLAUDE.md): it pushes a tagged image to a registry and stops.
# The host decides when to take it, by pulling. Nothing here reaches into a machine.
#
# Pull rather than push because the target is a homelab box on a tailnet, not a cloud
# endpoint: it has no stable inbound address, and CI holding credentials to it would be
# a much larger blast radius than a registry read token going the other way.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch/PR makes an in-flight run obsolete — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the runtime the image ships (Dockerfile: python:3.14-slim), so a passing
      # CI run means the same interpreter the container will use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint gate is deliberately NARROW: F (pyflakes — undefined names, unused imports,
      # broken f-strings) plus E9 (syntax/IO errors). These are bugs. Line length (E501)
      # is intentionally not enforced — this repo's dense, load-bearing comments run long
      # on purpose, and a blanket reformat would bury the reasoning they carry.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check --select F,E9 jobtracker/ tests/

      # Every module imports cleanly under the target interpreter — catches a syntax or
      # import error even in a file no test touches.
      - name: Compile
        run: python -m compileall -q jobtracker tests

      - name: Test
        run: python -m pytest tests -q

  # A broken Dockerfile is a broken build regardless of green tests, and this runs on
  # every branch and PR — the publish job below never sees a Dockerfile that did not
  # already build here. No push, no secrets, no registry.
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Built WITH the SDK arg, which is the shape publish uses. The bare build is the
      # easy one; the arg is what drags in the install-git-then-purge-it dance, and that
      # is the half with a history of breaking (git is absent from python:*-slim, so the
      # documented invocation could never have worked). Skipping it here would mean that
      # class of break first appears on main, where it blocks publish after the merge
      # rather than on the PR that caused it. Costs ~10s.
      - name: Build image
        run: |
          docker build -t jobtracker:ci \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg SIR_CLIENT=git+https://github.com/ida314/stupid-inference-router.git#subdirectory=clients/python \
            .

      # Same three assertions publish makes on the pushed image, made here on the one
      # that was just built. Publish still repeats them against what it actually pushed —
      # this catches the break a merge earlier, it does not replace that check.
      - name: Check the image does what it claims
        run: |
          docker run --rm --entrypoint python jobtracker:ci -c 'import sir_client'
          docker run --rm jobtracker:ci --help > /dev/null
          docker run --rm --entrypoint python jobtracker:ci -c '
          import jobtracker, sys
          v = jobtracker.build_version()
          print(v)
          sys.exit(0 if "+" in v else 1)'

  # Continuous deployment, the publishing half.
  publish:
    needs: [test, docker]
    # Green main only. A PR from a fork cannot reach the registry or the secret, and a
    # feature branch has no business becoming :latest on the box that runs nightly.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # arm64, matching the DGX Spark this deploys to. Emulating it through QEMU on an
    # x86 runner works and takes roughly ten times as long; a native runner is free.
    # If a second target ever needs amd64, this becomes buildx with two platforms —
    # not a second hand-maintained job.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write        # push to GHCR under this repo's owner
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is scoped to this repo and is enough to push to its own package.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Baking sir-client in is what makes `work` real on the target. Publishing without
      # it would leave a nightly model pass that no-ops in silence, which is the exact
      # failure-is-absence shape the rest of this project is built to avoid.
      #
      # The router repo is public (verified), so this needs no credential. Should it go
      # private, do NOT add a build arg — that is readable with `docker history` on the
      # published image. The Dockerfile already accepts an optional BuildKit secret:
      # add `secrets: | sir_token=${{ secrets.SIR_TOKEN }}` here with a fine-grained
      # read-only PAT. GITHUB_TOKEN cannot serve, being scoped to this repo alone.
      # A repo that goes private without that fails the clone loudly, which is the
      # behaviour to want — nothing here can quietly produce an SDK-less image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Immutable sha tag for rollback and for saying what is actually running;
          # :latest is what the host's auto-update follows.
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-tracker:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/job-tracker:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            SIR_CLIENT=git+https://github.com/ida314/stupid-inference-router.git#subdirectory=clients/python
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the SDK actually made it in. Nothing else in the
      # pipeline would notice its absence: `work` treats an unreachable model as a
      # no-op and exits 0, so a silently SDK-less image produces green runs forever.
      - name: Verify the published image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/job-tracker:sha-${{ github.sha }}
          docker run --rm --entrypoint python "$IMG" -c 'import sir_client'
          docker run --rm "$IMG" --help > /dev/null
          # The stamp must survive into the running process, not just onto a label.
          docker run --rm --entrypoint python "$IMG" -c '
          import jobtracker, sys
          v = jobtracker.build_version()
          print(v)
          sys.exit(0 if "+" in v else 1)'

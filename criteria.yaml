# Match criteria — the corrected, parser-validated successor to the fenced YAML
# block in backend-newgrad-2027-tracker.md.
#
# That block was never valid YAML (`"SDE I` was an unterminated quote) and nothing
# ever parsed it, because its only consumer was an LLM reading it as prose. This file
# is loaded and validated by jobtracker/criteria.py on every run — it is the component
# that can now be *detectably* wrong (DESIGN.md §2.1).
#
# Matching is deterministic and gated primarily on LEVEL (is this a new-grad / entry
# role?), because 2027 new-grad is the whole target. See jobtracker/match.py for how
# these lists combine into a MATCH / REJECT / UNCERTAIN verdict.

# Explicit entry-level / new-grad signals in a title. Presence of one (with no exclude
# hit) yields MATCH. Absence yields UNCERTAIN — the level lives in the JD body, which
# only the deferred LLM pass reads.
level_include:
  - new grad
  - new graduate
  - entry level
  - entry-level
  - associate
  - university grad
  - university graduate
  - early career
  - early-career
  - "2027"
  - "L3"
  - "E3"
  - "SDE I"
  - "SWE I"
  - "Software Engineer I"
  - junior
  - grad
  # `grad` is anchored on alphanumeric boundaries, so it does not fire inside
  # "Graduate" (the 'u' fails the lookahead) — "Graduate Software Engineer" sat in
  # UNCERTAIN, and a 2026-11-05 replay of live titles found many Simplify rows shaped
  # like it, 212 of them pinned by the model on what a title token answers. The
  # lookbehind keeps it out of "Undergraduate" and "Postgraduate". A graduate title
  # with no engineering signal ("Commercial Graduate Trainee") REJECTs through the
  # non-engineering gate, which is correct. Checked 2026-11-06 on the laptop copy
  # (9,150 postings): no employer name contains "graduate", and no title moved — the
  # copy predates the Simplify import. Plurals still walk through: "2027 Graduates"
  # stays UNCERTAIN, the safe direction.
  - graduate
  # Numbered level one. Only the Roman `Software Engineer I` was a token, so
  # "Software Engineer 1" and "Automation Engineer I" sat in UNCERTAIN (about 150
  # engineering rows in the 2026-11-05 live replay). The lookahead is what keeps
  # `engineer i` off "Engineer II"/"III" and off "Engineer in Test", and `engineer 1`
  # off "Engineer 10" and "Engineer 2027"; a test proves each. A "Senior/Staff
  # Software Engineer I" still REJECTs, because exclude_titles is read first.
  # Laptop copy, 2026-11-06: 7 uncertain → match and nothing else moved (Flexport
  # Automation Engineer I, Oscar Health Analytics Engineer I ×2 and IT Engineer I ×3,
  # Five9 Telecom Engineer I) — entry level, honestly; whether IT or telecom is on
  # target is the ranking pass's question, not the level gate's. Every "Technical
  # Support Engineer 1" was already a REJECT on `support engineer`.
  # Deliberately absent: `analyst 1` (no engineering signal, so it would only turn
  # UNCERTAIN into a non-engineering REJECT) and `sde 1` (no title in the corpus
  # carries it — add it when one does). `developer 1` has no corpus hit either; it
  # is the same shape as `engineer 1` on the other engineering noun.
  - engineer 1
  - developer 1
  - engineer i

# Hard disqualifiers in a title -> REJECT. Order-independent; first hit wins the reason.
# Short tokens (ii, iii, vp) are matched on alphanumeric boundaries so "ii" does not
# fire inside "iii" and "iii" does not fire inside a word.
exclude_titles:
  - senior
  - "sr."
  - staff
  - principal
  - lead
  - manager
  - director
  - head of
  - vp
  - intern
  - internship
  # Plural, because _compile() anchors on alphanumeric boundaries: the token
  # `internship` does NOT fire inside "Internships" (the trailing 's' fails the
  # lookahead), which is the same mechanism that stops `ii` firing inside `iii`.
  # Six NVIDIA reqs — two of them Ph.D. — were MATCHing on `level:2027` with the
  # exclusion sitting right there and never firing. Measured 2026-09-08.
  - internships
  - ii
  - iii
  - "2026 grad"
  - "2025 grad"
  - contractor
  - "5+ years"
  - "3+ years"
  - clearance          # citizenship_note: exclude roles needing active clearance
  # Arabic seniority levels, the counterpart of `ii`/`iii`. MongoDB, Datadog, Twilio
  # and Kong number their ladders ("Software Engineer 3", "SRE 2"), so those titles
  # sat in UNCERTAIN (36 "Full-stack Engineer 4"-shaped rows in the 2026-11-05 live
  # replay). Only the exact tokens the corpus carries are listed — found by grepping
  # the laptop copy's titles for (engineer|developer|researcher|scientist|sre) [2-9]
  # on 2026-11-06: engineer 2 (21), engineer 3 (33), engineer 4 (1), sre 2 (3);
  # no developer, researcher or scientist is numbered. Never a bare digit: "2" is in
  # every "2027". The lookahead keeps `engineer 2` off "Engineer 2027", and no
  # employer name in the corpus contains any of them. Engineer 1 is level ONE, an
  # entry token in level_include, not here. Replay on that copy: 44 uncertain →
  # reject and nothing else moved; the other 14 numbered titles were already REJECTs
  # on `support engineer` or `sales`.
  - engineer 2
  - engineer 3
  - engineer 4
  - sre 2
  # Undotted "Sr". `sr.` needs its dot, so "Sr Accounting Specialist" and
  # "Sr Software Engineer, Infrastructure" sat in UNCERTAIN (46 rows in the 2026-11-05
  # live replay). Alphanumeric boundaries keep it out of "SRE", "sre" and "Srinivasan";
  # "Sr." still REJECTs on `sr.`, which comes first in this list, so no existing
  # reason changes. Latent: a hyphenated technical "SR-" ("SR-IOV") would fire, and
  # no corpus title has one. Checked 2026-11-06 on the laptop copy: no employer name is
  # or contains the word "Sr", and the replay moved 28 uncertain → reject (Databricks
  # 10, Five9 11, Elastic 3, Gusto, MongoDB, SoFi, SolarWinds) and nothing else; the
  # other 15 undotted-Sr titles were already REJECTs on another token.
  - sr

# Engineering signal. A MATCH requires a level token AND an engineering signal — either
# a backend-specific term below (role_type_include) or a generic engineering term here.
# This is what stops "Finance Associate" / "Operations Associate" (level word, no eng)
# from matching a backend tracker. A level word on a non-engineering title -> REJECT.
engineering_terms:
  - engineer
  - engineering
  - developer
  - software
  - programmer
  - swe
  - sde
  - sre
  - devops

# Backend-relevance signal. A hit here both satisfies the engineering gate and is noted
# in the verdict reason as backend-relevant (vs a generic engineering match).
role_type_include:
  - backend
  - back-end
  - full-stack
  - fullstack
  - full stack
  - platform
  - infrastructure
  - distributed systems
  - systems
  - API
  - server
  - data engineering
  - site reliability
  - SRE

# Off-target role families -> REJECT even when a level token is present. Encodes the
# CLAUDE.md goal "Not frontend, not ML-first" as an enforced rule.
role_type_exclude:
  - frontend
  - front-end
  - front end
  - mobile
  - ios
  - android
  - machine learning
  - "ml engineer"
  - deep learning
  - data scientist
  - product manager
  - product designer
  - designer
  - sales
  - marketing
  - recruiter
  # Business/pre-sales titles that DO contain "engineer" and would otherwise slip the
  # engineering gate below. Listed explicitly so they REJECT with a clear reason.
  - solutions engineer
  - sales engineer
  - support engineer
  - solutions consultant
  - solutions architect
  - customer success
  - customer experience
  - account executive
  - account manager
  # An operations title that satisfies the engineering gate through
  # role_type_include rather than engineering_terms — "Product Operations | AI
  # Revenue Systems" matched on `systems`. This is the "Finance Associate"
  # bug through a different door, which CLAUDE.md has recorded as open since
  # 2026-07-23. Listed here rather than narrowing `systems`, because that token
  # is load-bearing for real distributed-systems titles.
  - product operations

  # Hardware / chip design. This tracker is backend — distributed systems,
  # infrastructure, platform, data engineering, SRE — and an ASIC or physical-design
  # req is off-target in the same way a frontend one is, not merely lower-ranked.
  # These leak in volume because they satisfy the engineering gate honestly: NVIDIA
  # and the Simplify feed publish hundreds of new-grad silicon roles whose titles read
  # "<hardware thing> Engineer", so `level:2027 + eng:generic` MATCHes every one.
  # 50 of 422 open matches were hardware when this was written (2026-09-08).
  #
  # Every token below was checked against the live corpus before being added, and the
  # test that matters here is NOT "does it catch hardware" but "does it catch anything
  # else". Aggregator titles are "Employer — Role", so a token also reads the *company
  # name*: `cadence` was dropped because it rejects four legitimate "Cadence Design
  # Systems — Software Engineer New Grad" reqs, and `analog` and `semiconductor` were
  # dropped unused for the same latent reason (Analog Devices, NXP Semiconductors).
  # That is the ashby/cedar rule applied to criteria: a string that identifies a role
  # for one employer identifies an employer for another.
  #
  # Deliberately NOT here: bare `verification` (formal verification is real backend
  # work), bare `hardware` (it would take "Software Engineer — Hardware Tools" and
  # "Engineer - Hardware Observability", which are software roles), and `timing` /
  # `synthesis`, which are generic words whose only hits `asic` already covers.
  - asic
  - soc
  - rtl
  - vlsi
  - fpga
  - verilog
  - physical design
  - circuit design
  - floorplan
  - chip design
  - pcb
  - dft
  - silicon engineering
  - hardware engineer
  - hardware engineering

# ---------------------------------------------------------------------------------
# Location: RANKS, never gates (2026-07-22, at the user's direction — no location is
# disqualifying, but US is preferred and NYC preferred above all).
#
# The old `locations_exclude` was a hard gate that fired BEFORE the level gate, so 390
# postings in London / Dublin / Bengaluru / Toronto / Singapore were rejected without
# their titles ever being read. That is gone. These three lists only order results:
#
#   rank 0  NYC              locations_nyc
#   rank 1  elsewhere in US  locations_us
#   rank 2  unknown          no list matched — deliberately ranked ABOVE explicit non-US
#   rank 3  outside the US   locations_non_us
#
# Unknown sits at 2, not last, because a bare "Remote" is more likely US-eligible than
# a posting that says "Bengaluru". Ranking is conservative where the data is vague.
#
# match.location_rank() checks NYC first, then non-US, then US. That order matters: the
# two-letter state codes below are ambiguous ("CA" is both California and Canada), so an
# explicit country name has to win before codes are consulted.
locations_nyc:
  - New York
  - NYC
  - Manhattan
  - Brooklyn

locations_us:
  # Explicit country markers first — these are unambiguous.
  - United States
  - USA
  - Remote US
  - Remote - US
  - US
  # Cities that appear often enough in these boards to be worth naming.

# What you would type into an application form. Copy to answers.yaml and fill in.
#
#   cp answers.example.yaml answers.yaml
#
# answers.yaml is GITIGNORED — it holds your name, email, phone, and whatever else an
# employer has asked for. This example file is the tracked one, and documents the shape.
#
# Curation, not observation (DESIGN.md §3.3), like companies.yaml and criteria.yaml.
# Two narrow machine writes exist and neither touches a line you wrote:
#
#   * `jobtracker work --task prefill` regenerates the block of unanswered questions at
#     the very end of the file.
#   * the Settings tab under `jobtracker serve` adds an answer you typed there.
#
# Loaded strictly. An unknown key, an unknown identity field, a missing name or email,
# or a resume path that is not a real file all raise — a silently-defaulted answer would
# be typed into a real job application.

# The fields every application asks for, under their canonical names. first_name,
# last_name and email are required; the rest are filled when a form asks for them.
identity:
  first_name: Ada
  last_name: Lovelace
  # preferred_name: Ada
  email: ada@example.edu
  phone: "+1 555 010 0000"
  location: New York, NY
  linkedin: https://www.linkedin.com/in/example
  github: https://github.com/example
  # website: https://example.com
  # school: New York University
  # degree: BS Computer Science
  # graduation_date: "2027-05"
  # pronouns: she/her

# A path, relative to this file. The browser attaches it with set_input_files() — the
# one thing no URL and no cookie can ever do. Checked at load, not at fill time:
# discovering it is missing while sitting on an open application is the worst moment.
resume: ./resume.pdf
# cover_letter: ./cover-letter.pdf

# Everything else, keyed by a slug. A plain string is the answer; the long form adds
# `aliases`, which are the exact question texts this answer covers. Aliases are what let
# an answer you wrote once be recognized at every company that phrases it the same way,
# with no model call at all.
answers:
  work_authorization:
    value: "Yes"
    aliases:
      - "Are you legally authorized to work in the United States?"
      - "Are you authorized to work in the location(s) you selected?"

  sponsorship_required:
    value: "No"
    aliases:
      - "Will you now or in the future require sponsorship for employment visa status?"
      - "Will you require sponsorship for a work permit now or in the future?"

  # A plain scalar is fine when the key already reads like the question.
  current_employer: "New York University"

  # For a dropdown, the value must be one of the options the form actually offers. An
  # answer that is not on the list is treated as a gap rather than typed in anyway —
  # picking the wrong entry is worse than being asked.
  country_of_residence: "United States"

# ===== unanswered questions · regenerated by `jobtracker work --task prefill` =====
#
# Uncomment a block, move it up into `answers:`, and fill in the value.
# Everything below this line is rewritten on every prefill run; everything
# above it is yours and is never touched.
#
# (nothing outstanding)
